<style>
/* ============ THEME TOKENS ============
   Components only use the semantic tokens below. Two themes:
   - Carbon (default): Taif's dark theme from the Collections prototype. Chrome sits below the work,
     cards are borderless surfaces, one full-strength string per card, and the spruce accent is only
     used for things you can tap (Start, the timer button, selected states).
   - Calm: a soft light theme (terracotta, sage, lavender, sand on cream) — replaced the earlier greyscale one.
   - Mono: black and white dark mode. Cards get a white outline; emoji icons keep their colour.
   Calm is the default. The settings button cycles Calm -> Carbon -> Mono. */
:root, :root[data-app-theme="carbon"]{
  color-scheme:dark;
  /* Carbon base palette */
  --page:#09090A; --bg:#121213; --chrome:#09090A;
  --surface:#242428; --surface-2:#2E2E33; --surface-3:#3A3A40;
  --card:#242428;
  --line:#313137; --line-2:#3C3C43;
  --ink:#FAFAFA; --ink-2:#B4B4B8; --muted:#95959A; --faint:#5E5E64;
  --accent:#5FB3A9; --accent-ink:#0B0B0C; --accent-soft:#1B2E2B;
  /* component roles */
  /* card hues: each preset card gets its own colour */
  --h-spruce:#5FB3A9; --h-amber:#D9A566; --h-blue:#8FA6DC; --h-purple:#B49BE0; --h-green:#77BE9A; --h-rose:#D89A94;
  /* how strongly a card's hue tints each part (0% = no colour) */
  --tint-card:15%; --tint-chip:22%; --tint-emoji:32%; --tint-strong:100%;
  --emoji-bg:var(--surface-2); --emoji-filter:none;
  --chip-bg:var(--surface-2); --chip-ink:var(--ink-2);
  --chip-brk-bg:transparent; --chip-brk-ink:var(--muted); --chip-brk-edge:var(--line-2);
  --chip-loop-bg:var(--surface-3); --chip-loop-ink:#0B0B0C;
  --btn-bg:var(--surface-2); --btn-bg-press:var(--surface-3); --btn-ink:var(--ink-2);
  --start-bg:var(--accent); --start-ink:var(--accent-ink);
  --cal-0:var(--surface-2); --cal-1:#2F5550; --cal-2:#468A81; --cal-3:var(--accent);
  --cal-ink-1:#FAFAFA; --cal-ink-2:#FAFAFA; --cal-ink-3:#0B0B0C;
  --ring-track:var(--line-2); --ring-fill:var(--ink);
  --toast-bg:var(--surface-3); --toast-ink:var(--ink);
  --frame:#2E2E33;
  --tint-fill:42%; --tint-fill-break:26%; --fill-base:var(--card); --t-edge:transparent;
  --card-edge:transparent; --card-edge-w:0px; --edge-mix:0%;
  --dim-1:.72; --dim-2:.55;   /* back cards in the deck recede */
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -20px rgba(0,0,0,.9);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 28px 60px -28px rgba(0,0,0,1);
  --font-display:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; /* headers + large text */
  --font-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-app-theme="calm"]{
  /* Calm: a soft light theme — terracotta, sage, lavender and sand on warm cream, with slate ink */
  color-scheme:light;
  --page:#EFE8DD; --bg:#FAF6F0; --chrome:#FAF6F0;
  --surface:#FFFFFF; --surface-2:#F3EDE4; --surface-3:#E8E0D4;
  --card:#FFFFFF;
  --line:#EAE2D6; --line-2:#D9CFC1; --new-edge:#B9AD9D;
  --ink:#2E3440; --ink-2:#4C5563; --muted:#7A7F88; --faint:#B3B0AA;
  --accent:#F2CC8F; --accent-ink:#2E3440; --accent-soft:#FBEFD9;
  /* card hues: focus terracotta, sand, dusty blue, lavender, sage, rose */
  --h-spruce:#E07A5F; --h-amber:#F2CC8F; --h-blue:#7EA6C4; --h-purple:#9A8FC7; --h-green:#81B29A; --h-rose:#D48C9E;
  --tint-card:18%; --tint-chip:6%; --tint-emoji:26%; --tint-strong:100%;
  --emoji-bg:#FFFFFF; --emoji-filter:none;
  --chip-bg:#FFFFFF; --chip-ink:#2E3440;
  --chip-brk-bg:transparent; --chip-brk-ink:#5E646E; --chip-brk-edge:#CFC5B7;
  --chip-loop-bg:#2E3440; --chip-loop-ink:#2E3440;   /* strong chips/buttons are the card hue with slate text */
  --btn-bg:#FFFFFF; --btn-bg-press:#F3EDE4; --btn-ink:#2E3440;
  --start-bg:#2E3440; --start-ink:#2E3440;
  --cal-0:#F3EDE4; --cal-1:#F6D5CB; --cal-2:#EBA592; --cal-3:#E07A5F;
  --cal-ink-1:#2E3440; --cal-ink-2:#2E3440; --cal-ink-3:#2E3440;
  --ring-track:rgba(46,52,64,.14); --ring-fill:#2E3440;
  --toast-bg:#2E3440; --toast-ink:#FAF6F0;
  --frame:#2E3440;
  --tint-fill:55%; --tint-fill-break:36%; --fill-base:#FFFFFF; --fill-break-base:#FFFFFF; --t-edge:transparent;
  --card-edge:transparent; --card-edge-w:2px; --edge-mix:100%;   /* outline = the card's button colour */
  --dim-1:.97; --dim-2:.93;
  --shadow:0 10px 28px -14px rgba(46,52,64,.28);
  --shadow-sm:0 4px 14px -8px rgba(46,52,64,.22);
  --shadow-lg:0 40px 80px -30px rgba(46,52,64,.45);
}
:root[data-app-theme="mono"]{
  color-scheme:dark;
  --page:#000000; --bg:#000000; --chrome:#000000;
  --surface:#111111; --surface-2:#1F1F1F; --surface-3:#333333;
  --card:#000000;
  --line:#2A2A2A; --line-2:#555555; --new-edge:#FFFFFF;
  --ink:#FFFFFF; --ink-2:#D0D0D0; --muted:#9A9A9A; --faint:#5A5A5A;
  --accent:#FFFFFF; --accent-ink:#000000; --accent-soft:#1F1F1F;
  --h-spruce:#8A8A8A; --h-amber:#8A8A8A; --h-blue:#8A8A8A; --h-purple:#8A8A8A; --h-green:#8A8A8A; --h-rose:#8A8A8A;
  --tint-card:0%; --tint-chip:0%; --tint-emoji:0%; --tint-strong:0%;
  --emoji-bg:#1F1F1F; --emoji-filter:none;
  --chip-bg:#1F1F1F; --chip-ink:#FFFFFF;
  --chip-brk-bg:transparent; --chip-brk-ink:#9A9A9A; --chip-brk-edge:#555555;
  --chip-loop-bg:#FFFFFF; --chip-loop-ink:#000000;
  --btn-bg:#1F1F1F; --btn-bg-press:#333333; --btn-ink:#FFFFFF;
  --start-bg:#FFFFFF; --start-ink:#000000;
  --cal-0:#1F1F1F; --cal-1:#555555; --cal-2:#9A9A9A; --cal-3:#FFFFFF;
  --cal-ink-1:#FFFFFF; --cal-ink-2:#000000; --cal-ink-3:#000000;
  --ring-track:#444444; --ring-fill:#FFFFFF;
  --toast-bg:#FFFFFF; --toast-ink:#000000;
  --frame:#333333;
  --tint-fill:0%; --tint-fill-break:0%; --fill-base:#1C1C1C; --fill-break-base:#0D0D0D; --t-edge:#FFFFFF;
  --card-edge:#FFFFFF; --card-edge-w:2px; --edge-mix:0%;   /* outlined cards, like the New preset card */
  --dim-1:.6; --dim-2:.4;
  --shadow:0 0 #0000; --shadow-sm:0 0 #0000;
  --shadow-lg:0 0 0 1px #333333;
}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--page);
  font-family:var(--font-body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
body.embed{background:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* ============ PHONE SHELL ============ */
.phone{
  position:relative;
  width:100%;
  height:100%;
  background:var(--bg);
  overflow:hidden;
  display:flex;flex-direction:column;
}
@media (min-width:600px) and (min-height:640px) and (hover:hover) and (pointer:fine){
  body{display:grid;place-items:center;padding:24px}
  .phone{
    width:390px;height:844px;max-height:calc(100vh - 48px);
    border-radius:48px;
    border:10px solid var(--frame);
    box-shadow:var(--shadow-lg);
  }
}

/* ============ TOP BAR ============ */
.topbar{background:var(--chrome);display:flex;align-items:center;justify-content:space-between;padding:12px 18px 4px}
.round-btn{
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-sm);
  transition:transform .15s;
}
.round-btn:active{transform:scale(.92)}
.avatar{background:var(--surface-3);color:var(--ink);font-weight:500;font-size:15px}
.logo span:nth-child(2){color:var(--h-spruce)}
.logo span:nth-child(4){color:var(--h-amber)}
.logo span:nth-child(6){color:var(--h-blue)}
.logo span:nth-child(8){color:var(--h-rose)}
.logo{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.5px;display:flex}

/* ============ DECK ============ */
.deck-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:14px;container-type:size}
.deck{
  /* 3:4 card that grows with the screen; on short screens it gets shorter rather than narrower */
  --dw:min(calc(100cqw - 68px), 520px);
  position:relative;flex:none;
  width:var(--dw);height:min(calc(var(--dw) * 4 / 3), calc(100cqh - 50px));
  touch-action:pan-y;container-type:size;
}
.card{
  position:absolute;inset:0;
  border-radius:30px;
  padding:20px;
  display:flex;flex-direction:column;
  overflow:hidden;
  --hue:var(--accent);
  --c-bg:color-mix(in srgb, var(--hue) var(--tint-card), var(--card));
  --c-chip:color-mix(in srgb, var(--hue) var(--tint-chip), var(--chip-bg));
  --c-emoji:color-mix(in srgb, var(--hue) var(--tint-emoji), var(--emoji-bg));
  --c-strong:color-mix(in srgb, var(--hue) var(--tint-strong), var(--chip-loop-bg));
  --c-start:color-mix(in srgb, var(--hue) var(--tint-strong), var(--start-bg));
  --c-ring:color-mix(in srgb, var(--hue) var(--tint-strong), var(--ring-fill));
  --c-edge:color-mix(in srgb, var(--c-strong) var(--edge-mix), var(--card-edge));
  background:var(--c-bg);color:var(--ink);
  box-shadow:inset 0 0 0 var(--card-edge-w) var(--c-edge), var(--shadow);
  transition:transform .4s cubic-bezier(.2,.9,.3,1.15), opacity .3s, filter .3s;
  user-select:none;-webkit-user-select:none;
  will-change:transform;
  cursor:grab;
}
.card.dragging{transition:none;cursor:grabbing}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.emoji{filter:var(--emoji-filter);width:54px;height:54px;border-radius:18px;background:var(--c-emoji, var(--emoji-bg));display:grid;place-items:center;font-size:28px}
.card-body{margin-top:auto}
.card h2{font-family:var(--font-display);font-weight:600;font-size:32px;line-height:1.05;margin:0 0 6px;letter-spacing:-.3px;text-wrap:balance}
.meta{font-weight:700;font-size:14px;color:var(--muted)}

/* icon font */
.msr{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;overflow:hidden;width:1em;height:1em}

/* preset card */
.preset{padding:22px}
.p-head{display:flex;align-items:center;gap:12px;margin-top:8%}
.p-head .emoji{flex:none}
.p-name{
  font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.02;letter-spacing:-.3px;margin:0;
  min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips + .chips{margin-top:10px}
/* extra air around the step chips separates header, steps and info */
.chips.steps{margin-top:26px}
.chips.steps + .chips{margin-top:24px}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:12px;background:var(--c-chip);color:var(--chip-ink);font-weight:600;font-size:15px;white-space:nowrap}
.chip[hidden]{display:none}
/* info row (total time, goal) sits back from the steps: chip fill at 50% opacity */
.chips.info .chip{background:color-mix(in srgb, var(--c-chip) 50%, transparent)}
.chip.brk{background:var(--chip-brk-bg);color:var(--chip-brk-ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--hue) var(--tint-chip), var(--chip-brk-edge))}
.chip.more{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.chip.loop{background:var(--c-strong);color:var(--chip-loop-ink);padding:0 10px 0 8px;gap:3px}
.chip.loop .msr{font-size:19px}
.chip .ring{width:18px;height:18px;flex:none}
.ring .rt{stroke:var(--ring-track)}
.ring .rf{stroke:var(--c-ring)}
.p-actions{--bh:68px;display:flex;align-items:center;gap:12px;margin-top:auto}  /* --bh: button height, never below 56px */
.p-btn{height:var(--bh);background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;font-weight:600;font-size:18px;transition:transform .15s,background .15s}
.p-btn:active{transform:scale(.96);background:var(--btn-bg-press)}
.p-btn.menu{width:var(--bh);flex:none;border-radius:50%}
.p-btn.menu .msr{font-size:30px}
.p-btn.start{flex:1;border-radius:calc(var(--bh) * .3);background:var(--c-start);color:var(--start-ink)}
.p-btn.start:active{background:var(--c-start);filter:brightness(1.1)}
/* quick timer card */
.card h2.q{font-size:26px}
.big-time{font-family:var(--font-display);font-weight:600;font-size:76px;line-height:.9;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:0 0 4px}
.q-center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.q-center .meta{margin-top:2px}
/* duration choices sit above Start; each is at least 44x44 */
.opts{display:flex;gap:10px;margin-bottom:12px}
.opt{flex:1;min-width:44px;min-height:44px;font-weight:700;font-size:15px;border-radius:14px;background:var(--c-chip);color:var(--chip-ink);transition:transform .15s}
.opt:active{transform:scale(.95)}
.opt.on{background:var(--c-strong);color:var(--chip-loop-ink)}

/* new card */
.card.new{background:var(--bg);box-shadow:inset 0 0 0 2px var(--new-edge, var(--line-2));align-items:center;justify-content:center;text-align:center}
.plus{width:76px;height:76px;border-radius:26px;background:var(--surface-2);display:grid;place-items:center;margin-bottom:16px;font-size:40px;font-family:var(--font-display);font-weight:500;color:var(--ink)}
.card.new h2{font-size:26px}
.card.new p{margin:0;color:var(--muted);font-weight:500;font-size:14px;max-width:200px}

.dots{display:flex;gap:6px;padding:22px 0 6px}
.dot{width:7px;height:7px;border-radius:99px;background:var(--line-2);transition:all .25s}
.dot.on{width:20px;background:var(--ink)}

/* ============ CALENDAR ============
   Nothing relies on colour alone: days with pomodoros show their count as a number,
   goals met get a check badge, today has a ring, future days are faded. */
.cal-section{padding:6px 22px 0;width:100%;max-width:564px;margin:0 auto}
.cal{background:var(--surface);border-radius:24px;padding:12px 14px 14px;box-shadow:var(--shadow-sm)}
.cal-month{font-size:13px;font-weight:700;color:var(--muted);padding:0 2px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:lowercase;padding-bottom:2px}
.day{
  position:relative;aspect-ratio:1.2;max-height:40px;border-radius:10px;background:var(--cal-0);
  display:grid;place-items:center;
  font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;
  transition:transform .15s;
}
.day:active{transform:scale(.9)}
.day.l1{background:var(--cal-1);color:var(--cal-ink-1)}
.day.l2{background:var(--cal-2);color:var(--cal-ink-2)}
.day.l3{background:var(--cal-3);color:var(--cal-ink-3)}
.day.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.day.future{opacity:.45}
.day.blank{visibility:hidden}
/* goal met: a small check badge on the corner */
.day .met{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.day .met svg{width:11px;height:11px}

/* ============ DAY SHEET ============ */
.sheet-scrim{position:absolute;inset:0;z-index:44;background:rgba(0,0,0,.45)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:45;
  background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);
  padding:10px 20px 22px;display:flex;flex-direction:column;gap:14px;max-height:80%;overflow:auto;
}
.sheet-grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 2px}
.sheet h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:24px}
.sheet-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:18px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.1}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.sheet-sub{font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 -4px}
.sheet-goals{display:flex;flex-direction:column;gap:8px}
.g-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:10px 12px}
.g-row .emoji{width:40px;height:40px;font-size:20px;border-radius:13px;flex:none;background:var(--surface-3)}
.g-row .g-txt{flex:1;min-width:0}
.g-row .g-txt b{display:block;font-size:15px}
.g-row .g-txt span{font-size:13px;color:var(--muted);font-weight:600}
.g-row .met-pill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:12px;font-weight:700;flex:none}
.g-row .met-pill svg{width:13px;height:13px}
.sheet-empty{font-size:14px;color:var(--muted);font-weight:600;margin:0}
.sheet-close{height:56px;border-radius:18px;background:var(--surface-2);font-weight:700;font-size:16px;color:var(--ink)}
.sheet-close:active{background:var(--surface-3)}

/* ============ BOTTOM NAV ============ */
.nav{background:var(--chrome);display:flex;justify-content:center;padding:14px 0 16px}
.nav-pill{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--shadow-sm)}
.nav-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:transform .15s,background .2s}
.nav-btn:active{transform:scale(.9)}
.nav-btn.main{width:62px;height:62px;margin:-14px 0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}

/* ============ TOAST ============ */
.toast{
  position:absolute;left:50%;bottom:104px;transform:translate(-50%,12px);
  background:var(--toast-bg);color:var(--toast-ink);box-shadow:var(--shadow-lg);font-weight:700;font-size:14px;
  padding:10px 16px;border-radius:14px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:all .25s;z-index:50;
}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ============ TIMER PAGE ============
   The screen is the card's colour; a fill drains downward as the current step runs out. */
.timer{
  position:absolute;inset:0;z-index:40;
  display:flex;flex-direction:column;overflow:hidden;container-type:size;
  --hue:var(--accent);
  --c-bg:color-mix(in srgb, var(--hue) var(--tint-card), var(--card));
  --c-chip:color-mix(in srgb, var(--hue) var(--tint-chip), var(--chip-bg));
  --c-emoji:color-mix(in srgb, var(--hue) var(--tint-emoji), var(--emoji-bg));
  --c-strong:color-mix(in srgb, var(--hue) var(--tint-strong), var(--chip-loop-bg));
  --c-start:color-mix(in srgb, var(--hue) var(--tint-strong), var(--start-bg));
  --t-fill:color-mix(in srgb, var(--hue) var(--tint-fill), var(--fill-base));
  background:var(--c-bg);color:var(--ink);
}
.timer.is-break{--t-fill:color-mix(in srgb, var(--hue) var(--tint-fill-break), var(--fill-break-base, var(--fill-base)))}
.timer > :not(.t-fill){position:relative;z-index:1}
.t-fill{position:absolute;inset:0;background:var(--t-fill);will-change:transform;transition:background-color .6s}
.t-wave{position:absolute;left:0;bottom:calc(100% - 1px);width:200%;height:18px;color:var(--t-fill);animation:wave 3.2s linear infinite;transition:color .6s}
.t-wave .edge{fill:none;stroke:var(--t-edge);stroke-width:2;vector-effect:non-scaling-stroke}
@keyframes wave{to{transform:translateX(-50%)}}
.timer.paused .t-wave{animation-play-state:paused}

.t-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
.t-title{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700;font-size:16px}
.t-title .emoji{width:40px;height:40px;font-size:20px;border-radius:14px;flex:none}
.t-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-speed{flex:none;display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 14px 0 10px;border-radius:14px;background:var(--c-chip);color:var(--chip-ink);font-weight:700;font-size:14px;transition:background .2s}
.t-speed .msr{font-size:20px}
.t-speed[aria-pressed="true"]{background:var(--c-strong);color:var(--chip-loop-ink)}

.t-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 16px;text-align:center}
.t-step{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,8cqw,40px);line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-digits{display:flex;font-family:var(--font-display);font-weight:600;font-size:min(29cqw,19cqh);line-height:1;letter-spacing:-.01em}
.dg{display:inline-block;width:.6em;text-align:center}
.dg.colon{width:.3em;transform:translateY(-.06em)}
.timer.paused .t-digits{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
/* digits + tags: the tags sit right under the digits, centred on screen and wrapping within the digits' width */
.t-block{display:inline-grid;justify-items:center;max-width:100%}
.t-tags{width:0;min-width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.t-steps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.t-chip{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 12px;border-radius:12px;background:var(--c-chip);color:var(--chip-ink);font-weight:600;font-size:14px;white-space:nowrap;transition:background .3s,color .3s,opacity .3s}
.t-chip.brk{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--muted)}
.t-chip.done{opacity:.35}
.t-chip.now{background:var(--c-strong);color:var(--chip-loop-ink);box-shadow:none}
.t-chip.loopc{background:color-mix(in srgb, var(--c-strong) 45%, transparent);color:var(--ink);padding:0 11px 0 9px}
.t-chip.loopc .msr{font-size:18px}
.t-chip[hidden],.t-steps[hidden]{display:none}

/* controls: round secondary buttons around a wide Play/Pause, same shapes as the preset cards */
.t-controls{--bh:64px;display:flex;align-items:center;gap:12px;padding:16px 18px 24px}
.t-round{flex:none;width:var(--bh);height:var(--bh);border-radius:50%;display:grid;place-items:center;background:var(--c-chip);color:var(--ink);transition:transform .15s,background .2s,color .2s}
.t-round .msr{font-size:28px}
.t-round:active{transform:scale(.92)}
.t-round.confirm{background:var(--c-strong);color:var(--chip-loop-ink)}
.t-round .msr,.t-play .msr{font-variation-settings:'FILL' 1}
/* Play = rounded square; while running (Pause) it morphs into a full pill */
.t-play{flex:1;height:var(--bh);border-radius:calc(var(--bh) * .3);display:grid;place-items:center;background:var(--c-start);color:var(--start-ink);box-shadow:var(--shadow);
  transition:border-radius .55s cubic-bezier(.34,1.8,.5,1)}
.t-play.on{border-radius:calc(var(--bh) / 2)}
.t-play .msr{font-size:34px}
.timer.ready .t-play{animation:invite 1.8s ease-out infinite}
.timer.enter.ready .t-play{animation:rise .55s cubic-bezier(.3,1.5,.5,1) calc(var(--k) * 70ms + 200ms) both, invite 1.8s ease-out 1.2s infinite}
@keyframes invite{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--c-start) 55%, transparent)}70%,100%{box-shadow:0 0 0 16px color-mix(in srgb, var(--c-start) 0%, transparent)}}

/* entrance: digits roll up, step name drops in, chips pop, controls spring up */
.timer.entering .t-top,.timer.entering .t-step,.timer.entering .t-digits,.timer.entering .t-tags,.timer.entering .t-controls{opacity:0}
.timer.enter .dg{animation:roll .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k) * 60ms + 60ms)}
.timer.enter .t-step{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both}
.timer.enter .t-top{animation:fadeup .4s .35s both}
.timer.enter .t-chip{animation:pop .4s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--k) * 40ms + 300ms)}
.timer.enter .t-controls > *{animation:rise .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--k) * 70ms + 200ms)}
.timer.leaving > :not(.t-fill){opacity:0;transition:opacity .15s}
@keyframes roll{from{transform:translateY(70%) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeup{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}

@container (max-height:620px){
  .t-top{padding:10px 16px}
  .t-controls{--bh:56px;padding:10px 16px 16px}
}

@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-26px) rotate(-4deg)}60%{transform:translateX(8px) rotate(1deg)}}
.card.nudge{animation:nudge 1s ease-in-out .6s}

@media (max-height:700px){
  .topbar{padding:8px 18px 2px}
  .cal-grid{gap:4px}
  .day{max-height:24px;border-radius:7px;font-size:12px}
  .day .met{width:14px;height:14px;top:-4px;right:-4px}
  .day .met svg{width:9px;height:9px}
  .cal-month{padding-bottom:4px}
  .nav{padding:10px 0 10px}
}
@container (min-width:400px){
  .preset{padding:28px}
  .chips.steps{margin-top:32px}
  .chips.steps + .chips{margin-top:30px}
  .p-name{font-size:44px}
  .chip{height:38px;font-size:16px}
  .p-actions{--bh:80px}
  .p-btn{font-size:20px}
  .card{padding:28px}
  .card h2{font-size:42px}
  .card h2.q{font-size:32px}
  .big-time{font-size:104px}
  .emoji{width:66px;height:66px;font-size:34px;border-radius:22px}
  .meta{font-size:16px}
  .opt{font-size:16px;min-height:52px;border-radius:16px}
}
@container (max-height:400px){
  .preset{padding:16px}
  .p-head{margin-top:2%}
  .p-name{font-size:27px}
  .chips{margin-top:12px}
  .chips.steps{margin-top:18px}
  .chips.steps + .chips{margin-top:16px}
  .chip{height:30px;font-size:13px;padding:0 9px}
  .p-actions{--bh:60px}
  .p-btn{font-size:17px}
  .card{padding:16px 18px}
  .card h2{font-size:26px}
  .card h2.q{font-size:22px}
  .big-time{font-size:52px}
  .emoji{width:42px;height:42px;font-size:22px;border-radius:14px}
  .card.quick .meta{display:none}
  .opts{margin-bottom:10px}
}
@container (max-height:320px){
  .preset{padding:14px}
  .p-head{margin-top:0;gap:10px}
  .p-name{font-size:24px}
  .emoji{width:40px;height:40px;font-size:20px}
  .chips{margin-top:10px;gap:6px}
  .chips + .chips{margin-top:6px}
  .chips.steps{margin-top:14px}
  .chips.steps + .chips{margin-top:12px}
  .chip{height:28px;font-size:13px}
  .p-actions{--bh:56px}
  .big-time{font-size:44px}
}
@media (prefers-reduced-motion:reduce){
  .card,.dot,.toast{transition:none}
  .t-wave,.timer.paused .t-digits,.timer.ready .t-play{animation:none}
  .card.nudge{animation:none}
}
</style>

<script>try{document.documentElement.dataset.appTheme=localStorage.getItem('pomogolo-theme')||'calm'}catch(e){document.documentElement.dataset.appTheme='calm'}</script>
<div class="phone" id="phone">
  <header class="topbar">
    <button class="round-btn avatar" data-soon="Profile" aria-label="Profile">JD</button>
    <div class="logo" aria-label="Pomogolo"><span>P</span><span>o</span><span>m</span><span>o</span><span>g</span><span>o</span><span>l</span><span>o</span></div>
    <button class="round-btn" id="themeBtn" aria-label="Settings (switch theme)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <section class="deck-wrap" aria-label="Presets">
    <div class="deck" id="deck"></div>
    <div class="dots" id="dots"></div>
  </section>

  <section class="cal-section" aria-label="This month">
    <div class="cal"><div class="cal-month" id="calTitle">Month</div><div class="cal-grid" id="calGrid"></div></div>
  </section>

  <nav class="nav">
    <div class="nav-pill">
      <button class="nav-btn" data-soon="Presets" aria-label="Presets">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor"/></svg>
      </button>
      <button class="nav-btn main" aria-label="Timer (home)" aria-current="page">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10M10 2.5h4M18.5 6.5l1.3-1.3"/></svg>
      </button>
      <button class="nav-btn" data-soon="Goals" aria-label="Goals">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.6 3.5M17 6h2.5a2.5 2.5 0 0 1-2.6 3.5M12 14v3.5M8.5 21h7M9.5 17.5h5V21h-5z"/></svg>
      </button>
    </div>
  </nav>

  <section class="timer" id="timer" hidden aria-label="Timer">
    <div class="t-fill" id="tFill" aria-hidden="true">
      <svg class="t-wave" viewBox="0 0 400 18" preserveAspectRatio="none"><path d="M0 9 Q25 0 50 9 T100 9 T150 9 T200 9 T250 9 T300 9 T350 9 T400 9 V18 H0 Z" fill="currentColor"/><path class="edge" d="M0 9 Q25 0 50 9 T100 9 T150 9 T200 9 T250 9 T300 9 T350 9 T400 9"/></svg>
    </div>
    <header class="t-top">
      <div class="t-title"><div class="emoji" id="tEmoji"></div><span class="t-name" id="tName"></span></div>
      <button class="t-speed" id="tSpeed" aria-pressed="false" title="Makes the timer run 60× faster for testing"><span class="msr" aria-hidden="true">bolt</span>Demo speed</button>
    </header>
    <div class="t-main">
      <div class="t-step" id="tStep"></div>
      <div class="t-block">
        <div class="t-digits" id="tDigits" role="timer" aria-live="off"></div>
        <div class="t-tags">
          <div class="t-steps" id="tSteps"></div>
          <span class="t-chip loopc" id="tLoopChip" style="--k:8"><span class="msr" aria-hidden="true">repeat</span><span id="tLoopTxt"></span></span>
        </div>
      </div>
    </div>
    <div class="t-controls">
      <button class="t-round" id="tEnd" style="--k:0" aria-label="End session"><span class="msr" aria-hidden="true">stop</span></button>
      <button class="t-play" id="tPlay" style="--k:1" aria-label="Start"><span class="msr" aria-hidden="true">play_arrow</span></button>
      <button class="t-round" id="tSkip" style="--k:2" aria-label="Skip step"><span class="msr" aria-hidden="true">skip_next</span></button>
    </div>
  </section>

  <div class="sheet-scrim" id="sheetScrim" hidden></div>
  <section class="sheet" id="daySheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
    <button class="sheet-close" id="sheetClose">Close</button>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  // ?embed: transparent page around the phone frame, for iframes on a portfolio site
  if (/[?&]embed\b/.test(location.search)){ document.body.classList.add('embed'); document.documentElement.style.cssText += ';color-scheme:normal;background:transparent'; }

  /* ============ DATA ============ */
  const presets = [
    { id:'quick', kind:'quick', name:'Quick Focus', emoji:'⏱️', color:'var(--h-spruce)', minutes:25, options:[15,25,45] },
    { id:'deep', name:'Deep Work', emoji:'🔥', color:'var(--h-amber)', loops:5,
      steps:[{type:'activity',name:'Work',min:15},{type:'activity',name:'Reflect',min:5},{type:'break',min:5}] },
    { id:'read', name:'Reading', emoji:'📚', color:'var(--h-blue)', loops:2,
      steps:[{type:'activity',name:'Read',min:30},{type:'break',min:5}],
      goal:{label:'3/5 this week', progress:3/5} },
    { id:'guitar', name:'Guitar Practice', emoji:'🎸', color:'var(--h-purple)', loops:3,
      steps:[{type:'activity',name:'Scales',min:10},{type:'activity',name:'Songs',min:20},{type:'break',min:5}],
      goal:{label:'1h 40m / 3h', progress:100/180} },
    { id:'study', name:'Study Loop', emoji:'🧠', color:'var(--h-green)', loops:4,
      steps:[{type:'activity',name:'Study',min:25},{type:'break',min:5}] },
    { id:'lang', name:'Morning Language Practice Routine', emoji:'🗣️', color:'var(--h-rose)', loops:2,
      steps:[{type:'activity',name:'Vocabulary',min:10},{type:'activity',name:'Listening',min:15},{type:'activity',name:'Speaking',min:10},{type:'break',min:5},{type:'activity',name:'Writing',min:15},{type:'activity',name:'Review',min:5},{type:'break',min:10}],
      goal:{label:'12/20 this month', progress:12/20} },
    { id:'new', kind:'new' }
  ];

  const fmt = m => { const h=Math.floor(m/60), r=m%60; return h ? (r? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
  const ringSVG = p => {
    const r=7, c=2*Math.PI*r;
    return `<svg class="ring" viewBox="0 0 18 18"><circle class="rt" cx="9" cy="9" r="${r}" fill="none" stroke-width="3"/><circle class="rf" cx="9" cy="9" r="${r}" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 9 9)"/></svg>`;
  };

  function cardHTML(p){
    if (p.kind==='new') return `
      <div class="plus">+</div>
      <h2>New preset</h2>
      <p>Mix activities and breaks, then set how many loops.</p>`;
    if (p.kind==='quick') return `
      <div class="card-top"><div class="emoji">${p.emoji}</div></div>
      <div class="q-center">
        <div class="big-time" data-time>${p.minutes}:00</div>
        <h2 class="q">${p.name}</h2>
        <div class="meta">No setup. Just tap and go.</div>
      </div>
      <div class="opts" role="group" aria-label="Duration">${p.options.map(o=>`<button class="opt ${o===p.minutes?'on':''}" data-min="${o}" aria-pressed="${o===p.minutes}">${o} min</button>`).join('')}</div>
      <div class="p-actions"><button class="p-btn start" data-start>Start</button></div>`;
    const total = p.steps.reduce((s,x)=>s+x.min,0)*p.loops;
    const steps = p.steps.map(st=> st.type==='break'
      ? `<span class="chip brk" data-step>Break ${st.min}</span>`
      : `<span class="chip" data-step>${st.name} ${st.min}</span>`).join('');
    return `
      <div class="p-head">
        <div class="emoji">${p.emoji}</div>
        <h2 class="p-name">${p.name}</h2>
      </div>
      <div class="chips steps">${steps}<span class="chip loop" aria-label="${p.loops} loops"><span class="msr" aria-hidden="true">repeat</span>${p.loops}</span></div>
      <div class="chips info">
        <span class="chip">${fmt(total)}</span>
        ${p.goal?`<span class="chip">${ringSVG(p.goal.progress)}${p.goal.label}</span>`:''}
      </div>
      <div class="p-actions">
        <button class="p-btn menu" data-menu aria-label="More options for ${p.name}"><span class="msr" aria-hidden="true">more_horiz</span></button>
        <button class="p-btn start" data-start>Start</button>
      </div>`;
  }

  // Keep step chips to two rows: hide the overflow and show "+N" before the loop chip
  function fitSteps(){
    document.querySelectorAll('.chips.steps').forEach(row=>{
      row.querySelectorAll('.chip.more').forEach(m=>m.remove());
      const chips=[...row.querySelectorAll('[data-step]')];
      chips.forEach(c=>c.hidden=false);
      const h=chips[0]?.offsetHeight||34, gap=parseFloat(getComputedStyle(row).rowGap)||8, max=h*2+gap+1;
      if(row.offsetHeight<=max) return;
      const loop=row.querySelector('.loop');
      const more=document.createElement('span'); more.className='chip more';
      row.insertBefore(more, loop);
      let hidden=0;
      for(let i=chips.length-1;i>=0 && row.offsetHeight>max;i--){
        chips[i].hidden=true; hidden++; more.textContent=`+${hidden}`;
      }
    });
  }

  /* ============ DECK ============ */
  const deck = document.getElementById('deck');
  const dotsEl = document.getElementById('dots');
  const els = presets.map((p,i)=>{
    const el = document.createElement('div');
    el.className = 'card ' + (p.kind||'preset');
    if (p.color) el.style.setProperty('--hue', p.color);
    el.innerHTML = cardHTML(p);
    el.dataset.i = i;
    deck.appendChild(el);
    return el;
  });
  let order = presets.map((_,i)=>i);

  const POS = [
    'translate(0,0) rotate(0deg) scale(1)',
    'translate(10px,8px) rotate(4deg) scale(.96)',
    'translate(-10px,14px) rotate(-5deg) scale(.93)'
  ];
  function layout(){
    order.forEach((idx,pos)=>{
      const el = els[idx];
      el.style.zIndex = 20-pos;
      el.style.transform = POS[Math.min(pos,2)];
      el.style.opacity = pos<3 ? 1 : 0;
      el.style.filter = pos===1 ? 'brightness(var(--dim-1))' : pos>=2 ? 'brightness(var(--dim-2))' : 'none';
      el.style.pointerEvents = pos===0 ? 'auto' : 'none';
      el.setAttribute('aria-hidden', pos===0 ? 'false' : 'true');
    });
    dotsEl.innerHTML = presets.map((_,i)=>`<button class="dot ${i===order[0]?'on':''}" data-go="${i}" aria-label="Preset ${i+1}"></button>`).join('');
  }
  const offscreen = dir => `translate(${dir*(deck.offsetWidth*1.4+80)}px,40px) rotate(${dir*28}deg)`;
  // next: top card flies out to the left and moves to the back of the deck
  function next(){
    const el = els[order[0]];
    el.style.transform = offscreen(-1);
    setTimeout(()=>{
      el.style.transition='none';
      el.style.opacity=0;
      order.push(order.shift());
      el.style.transform = POS[2];
      void el.offsetWidth;
      el.style.transition='';
      layout();
    },230);
  }
  // previous: the last card comes back in from the left onto the top
  function prev(){
    const el = els[order[order.length-1]];
    el.style.transition='none';
    el.style.opacity=1;
    el.style.zIndex=30;
    el.style.transform = offscreen(-1);
    void el.offsetWidth;
    el.style.transition='';
    order.unshift(order.pop());
    layout();
  }
  dotsEl.addEventListener('click', e=>{
    const b = e.target.closest('[data-go]'); if(!b) return;
    const t = +b.dataset.go; while(order[0]!==t) order.push(order.shift()); layout();
  });
  document.addEventListener('keydown', e=>{
    if (T.open){ if (e.key===' '){ e.preventDefault(); togglePause(); } return; }
    if (!sheet.hidden) return;
    if (e.key==='ArrowRight') next();
    if (e.key==='ArrowLeft') prev();
  });

  // drag / swipe
  let drag=null;
  deck.addEventListener('pointerdown', e=>{
    const el = e.target.closest('.card'); if(!el || el!==els[order[0]]) return;
    drag = {el, x:e.clientX, y:e.clientY, dx:0, moved:false, t:performance.now(), target:e.target};
    el.classList.remove('nudge');
    el.setPointerCapture(e.pointerId);
  });
  deck.addEventListener('pointermove', e=>{
    if(!drag) return;
    drag.dx = e.clientX-drag.x;
    const dy = e.clientY-drag.y;
    if(!drag.moved && Math.abs(drag.dx)>6 && Math.abs(drag.dx)>Math.abs(dy)){ drag.moved=true; drag.el.classList.add('dragging'); }
    // dragging right (back) moves the top card with resistance, since the previous card comes in from the left
    const x = drag.dx>0 ? drag.dx*.35 : drag.dx;
    if(drag.moved) drag.el.style.transform = `translate(${x}px,${Math.abs(x)*.06}px) rotate(${x*.06}deg)`;
  });
  const endDrag = e=>{
    if(!drag) return;
    const {el,dx,moved,t,target} = drag; drag=null;
    el.classList.remove('dragging');
    if(!moved){ handleTap(target, el); return; }
    const v = Math.abs(dx)/(performance.now()-t);
    if(Math.abs(dx)>70 || v>.5){
      if(dx<0) next();   // right to left: next card
      else prev();       // left to right: back one card
    } else layout();
  };
  deck.addEventListener('pointerup', endDrag);
  deck.addEventListener('pointercancel', endDrag);

  function handleTap(target, el){
    const p = presets[+el.dataset.i];
    const opt = target.closest('[data-min]');
    if(opt){
      p.minutes = +opt.dataset.min;
      el.querySelectorAll('.opt').forEach(o=>{ o.classList.toggle('on', o===opt); o.setAttribute('aria-pressed', o===opt); });
      el.querySelector('[data-time]').textContent = `${p.minutes}:00`;
      return;
    }
    if(p.kind==='new') return toast('Preset editor is coming next');
    if(target.closest('[data-menu]')) return toast('Edit, duplicate, delete: coming soon');
    if(target.closest('[data-start]')) return openTimer(p, el);
  }

  layout();
  fitSteps();
  new ResizeObserver(fitSteps).observe(deck);
  if(document.fonts) document.fonts.ready.then(fitSteps);
  setTimeout(()=>els[order[0]].classList.add('nudge'), 50);

  /* ============ CALENDAR ============ */
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const monthName = now.toLocaleString('en', {month:'long'});
  const daysIn = new Date(y, m+1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay()+6)%7;
  // deterministic sample data
  let seed = y*100+m;
  const rnd = ()=>{ seed = (seed*9301+49297)%233280; return seed/233280; };
  // sample goals (match the goal badges on the preset cards)
  const GOALS = [
    {emoji:'📚', name:'Reading', desc:'Read 5 days a week'},
    {emoji:'🎸', name:'Guitar Practice', desc:'3 hours a week'},
    {emoji:'🗣️', name:'Language', desc:'20 sessions a month'},
  ];
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const days = {};
  for(let d=1; d<=daysIn; d++){
    const r = rnd();
    const c = d>today ? 0 : (r<.42 ? 0 : 1+Math.floor(rnd()*6));
    const mins = c ? c*(15+Math.floor(rnd()*4)*5) : 0;
    const goals = c && rnd()<.4 ? GOALS.filter(()=>rnd()<.5) : [];
    days[d] = {c, mins, goals};
  }
  if(!days[today].c) days[today] = {c:2, mins:50, goals:[GOALS[0]]};

  const grid = document.getElementById('calGrid');
  let html = ['mon','tue','wed','thu','fri','sat','sun'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<lead;i++) html += `<div class="day blank"></div>`;
  for(let d=1; d<=daysIn; d++){
    const {c, goals} = days[d];
    const lvl = c===0 ? '' : c<=1 ? 'l1' : c<=3 ? 'l2' : 'l3';
    const cls = ['day', lvl, d===today?'today':'', d>today?'future':''].join(' ');
    const label = `${monthName} ${d}: ${c ? `${c} pomodoro${c>1?'s':''}` : 'no pomodoros'}${goals.length ? `, ${goals.length} goal${goals.length>1?'s':''} met` : ''}${d===today?', today':''}`;
    html += `<button class="${cls}" data-day="${d}" aria-label="${label}">${c ? `<span aria-hidden="true">${c}</span>` : ''}${goals.length ? `<span class="met" aria-hidden="true">${CHECK}</span>` : ''}</button>`;
  }
  grid.innerHTML = html;
  document.getElementById('calTitle').textContent = monthName;

  /* ---- tap a day: bottom sheet with the breakdown ---- */
  const sheet = document.getElementById('daySheet'), scrim = document.getElementById('sheetScrim');
  let sheetOpen = false, lastFocus = null;
  function openDay(d){
    const {c, mins, goals} = days[d];
    const date = new Date(y,m,d).toLocaleString('en',{weekday:'long', day:'numeric', month:'long'});
    document.getElementById('sheetTitle').textContent = d===today ? `Today · ${date}` : date;
    document.getElementById('sheetBody').innerHTML = c ? `
      <div class="sheet-stats">
        <div class="stat"><b>${c}</b><span>pomodoro${c>1?'s':''}</span></div>
        <div class="stat"><b>${mins<60 ? mins+'m' : fmt(mins)}</b><span>of activity</span></div>
      </div>
      <p class="sheet-sub">${goals.length ? 'Goals met' : 'Goals'}</p>
      <div class="sheet-goals">${goals.length ? goals.map(g=>`
        <div class="g-row"><div class="emoji">${g.emoji}</div><div class="g-txt"><b>${g.name}</b><span>${g.desc}</span></div><span class="met-pill">${CHECK}Met</span></div>`).join('')
        : '<p class="sheet-empty">No goals met this day.</p>'}</div>`
      : '<p class="sheet-empty">No pomodoros this day.</p>';
    sheetOpen = true; lastFocus = document.activeElement;
    sheet.hidden = false; scrim.hidden = false;
    if(!reducedMotion()){
      sheet.animate([{transform:'translateY(100%)'},{transform:'translateY(-3%)',offset:.7},{transform:'none'}],{duration:420,easing:'cubic-bezier(.3,1.1,.4,1)'});
      scrim.animate([{opacity:0},{opacity:1}],{duration:250});
    }
    document.getElementById('sheetClose').focus({preventScroll:true});
  }
  async function closeDay(){
    if(!sheetOpen) return; sheetOpen=false;
    if(!reducedMotion()){
      scrim.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
      await sheet.animate([{transform:'none'},{transform:'translateY(100%)'}],{duration:240,easing:'ease-in',fill:'forwards'}).finished;
    }
    sheet.hidden = true; scrim.hidden = true;
    sheet.getAnimations().forEach(a=>a.cancel()); scrim.getAnimations().forEach(a=>a.cancel());
    lastFocus && lastFocus.focus && lastFocus.focus({preventScroll:true});
  }
  function reducedMotion(){ return matchMedia('(prefers-reduced-motion: reduce)').matches; }
  grid.addEventListener('click', e=>{
    const b = e.target.closest('[data-day]'); if(!b) return;
    const d = +b.dataset.day;
    if(d>today) return toast(`${monthName} ${d} hasn't happened yet`);
    openDay(d);
  });
  scrim.addEventListener('click', closeDay);
  document.getElementById('sheetClose').addEventListener('click', closeDay);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDay(); });
  // swipe the sheet down to close
  let sy=null;
  sheet.addEventListener('pointerdown', e=>{ sy=e.clientY; });
  sheet.addEventListener('pointerup', e=>{ if(sy!==null && e.clientY-sy>60) closeDay(); sy=null; });


  /* ============ TIMER ============ */
  const $ = id => document.getElementById(id);
  const timer=$('timer'), tFill=$('tFill'), tDigits=$('tDigits'), tStep=$('tStep'), tSteps=$('tSteps'), tLoopChip=$('tLoopChip'), tLoopTxt=$('tLoopTxt');
  const tPlay=$('tPlay'), tEnd=$('tEnd'), tSkip=$('tSkip'), tSpeed=$('tSpeed');
  const T = { open:false, running:false, seq:[], i:0, dur:1, left:0, last:0, speed:1, activity:0, raf:0, card:null, p:null, ac:null, lock:null, endTimer:0 };
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const insetOf = el => {
    const t=timer.getBoundingClientRect(), c=el.getBoundingClientRect();
    return `inset(${c.top-t.top}px ${t.right-c.right}px ${t.bottom-c.bottom}px ${c.left-t.left}px round 30px)`;
  };
  const FULL = 'inset(0px 0px 0px 0px round 0px)';

  function buildSeq(p){
    const steps = p.kind==='quick' ? [{type:'activity', name:'Focus', min:p.minutes}] : p.steps;
    const loops = p.kind==='quick' ? 1 : p.loops;
    const seq=[];
    for(let l=1;l<=loops;l++) steps.forEach((st,k)=>seq.push({...st, loop:l, k}));
    return {seq, loops, steps};
  }
  const stepLabel = st => st.type==='break' ? 'Break' : st.name;

  function renderSteps(){
    const cur=T.seq[T.i];
    tSteps.hidden = T.steps.length<2;
    tSteps.innerHTML = T.steps.map((st,k)=>{
      const state = k<cur.k ? 'done' : k===cur.k ? 'now' : '';
      return `<span class="t-chip ${st.type==='break'?'brk':''} ${state}" style="--k:${k}">${stepLabel(st)} ${st.min}</span>`;
    }).join('');
    tLoopChip.hidden = T.loops<2;
    tLoopTxt.textContent = `${cur.loop} / ${T.loops}`;
    tLoopChip.setAttribute('aria-label', `Loop ${cur.loop} of ${T.loops}`);
  }
  function loadStep(i){
    T.i=i; const st=T.seq[i];
    T.dur = st.min*60000; T.left = T.dur;
    timer.classList.toggle('is-break', st.type==='break');
    tStep.textContent = stepLabel(st);
    // if the level has to jump (e.g. activity -> activity), let the fill swoosh there instead of snapping
    const startY = st.type==='break' ? 100 : 0;
    if (T.fillY!==undefined && Math.abs(T.fillY-startY)>5){
      tFill.style.transition='transform .9s cubic-bezier(.3,1.25,.5,1), background-color .6s';
      clearTimeout(T.fillT); T.fillT=setTimeout(()=>tFill.style.transition='', 900);
    }
    renderSteps(); render();
  }
  function render(){
    const secs = Math.max(0, Math.ceil(T.left/1000));
    const txt = `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
    if (tDigits.dataset.t !== txt){
      if (tDigits.children.length !== txt.length){
        tDigits.innerHTML = [...txt].map((ch,k)=>`<span class="dg${ch===':'?' colon':''}" style="--k:${k}">${ch}</span>`).join('');
      } else {
        [...txt].forEach((ch,k)=>{ if (tDigits.children[k].textContent!==ch) tDigits.children[k].textContent=ch; });
      }
      tDigits.dataset.t = txt;
      tDigits.setAttribute('aria-label', `${Math.floor(secs/60)} minutes ${secs%60} seconds left`);
    }
    const frac = T.left/T.dur, brk = T.seq[T.i].type==='break';
    T.fillY = brk ? frac*100 : (1-frac)*100;   // activity drains the screen, a break refills it
    tFill.style.transform = `translateY(${T.fillY}%)`;
  }
  function tick(now){
    if (!T.open) return;
    if (T.running){
      const dt = (now - T.last) * T.speed;
      if (T.seq[T.i].type!=='break') T.activity += Math.min(dt, T.left);
      T.left -= dt;
      if (T.left <= 0){
        chime();
        if (T.i < T.seq.length-1) loadStep(T.i+1);
        else { T.left=0; render(); return finish(); }
      }
      render();
    }
    T.last = now;
    T.raf = requestAnimationFrame(tick);
  }
  function chime(){
    try{
      const ctx=T.ac; if(!ctx) return;
      [[660,0],[880,.16]].forEach(([f,t])=>{
        const o=ctx.createOscillator(), g=ctx.createGain(), at=ctx.currentTime+t;
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(.22,at+.02); g.gain.exponentialRampToValueAtTime(.0001,at+.4);
        o.connect(g).connect(ctx.destination); o.start(at); o.stop(at+.45);
      });
    }catch(e){}
    try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){}
  }
  function setPlayIcon(){
    const icon = tPlay.querySelector('.msr'), want = T.running ? 'pause' : 'play_arrow';
    if (icon.textContent !== want){
      icon.textContent = want;
      if (T.started && !reduced()){
        tPlay.animate([{transform:'scale(1)'},{transform:'scale(.94,1.1)'},{transform:'scale(1.03,.96)'},{transform:'scale(1)'}],{duration:460,easing:'ease-out'});
        icon.animate([{transform:'scale(.2) rotate(-120deg)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.3,1.6,.5,1)'});
      }
    }
    tPlay.classList.toggle('on', T.running);
    tPlay.setAttribute('aria-label', !T.started ? 'Start' : T.running ? 'Pause' : 'Resume');
    timer.classList.toggle('ready', !T.started);
    timer.classList.toggle('paused', T.started && !T.running);
  }
  async function togglePause(){
    if(!T.open) return;
    const first = !T.started;
    T.started=true; T.running=!T.running; T.last=performance.now(); setPlayIcon();
    if (first){ try{ T.lock = navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; }catch(e){ T.lock=null; } }
  }
  const activityText = () => { const m=Math.round(T.activity/60000); return m<=0 ? '' : m<60 ? `${m} min` : fmt(m); };

  async function openTimer(p, card){
    if (T.open) return;
    T.open=true; T.p=p; T.card=card;
    try{ T.ac = T.ac || new (window.AudioContext||window.webkitAudioContext)(); T.ac.resume && T.ac.resume(); }catch(e){}
    const {seq, loops, steps} = buildSeq(p);
    Object.assign(T,{seq, loops, steps, activity:0, running:false, started:false, fillY:undefined});
    tFill.style.transition='';
    timer.style.setProperty('--hue', p.color || 'var(--accent)');
    $('tEmoji').textContent = p.emoji; $('tName').textContent = p.name;
    tEnd.classList.remove('confirm'); tPlay.classList.remove('on');
    loadStep(0); timer.classList.remove('paused');
    timer.classList.remove('enter','leaving'); timer.classList.add('entering');
    const motion = !reduced();
    if (motion){
      // 1. squash: the card gets pressed down, its contents pop like bubbles
      card.animate([{transform:POS[0]},{transform:'scale(1.04,.86)',offset:.55},{transform:'scale(.97,.93)'}],{duration:190,easing:'ease-out',fill:'forwards'});
      card.querySelectorAll('.emoji,.p-name,.chip:not([hidden]),.p-btn,.big-time,h2,.meta,.opt').forEach((c,k)=>
        c.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.3)',opacity:0}],{duration:200,delay:40+k*22,easing:'ease-in',fill:'forwards'}));
      await wait(200);
    }
    timer.hidden=false;
    if (motion){
      // 2. spring: the card's shape bursts out to fill the screen, then wobbles like jelly
      await timer.animate([{clipPath:insetOf(card)},{clipPath:FULL}],{duration:400,easing:'cubic-bezier(.55,0,.25,1)'}).finished;
      timer.animate([{transform:'scale(1)'},{transform:'scale(1.04,.955)'},{transform:'scale(.985,1.02)'},{transform:'scale(1.006,.995)'},{transform:'scale(1)'}],{duration:560,easing:'ease-out'});
    }
    card.getAnimations({subtree:true}).forEach(a=>a.cancel());
    // 3. content rolls in
    timer.classList.remove('entering'); if (motion) timer.classList.add('enter');
    setTimeout(()=>timer.classList.remove('enter'), 1500);
    // wait for the user to press Play
    T.last=performance.now(); setPlayIcon();
    cancelAnimationFrame(T.raf); T.raf=requestAnimationFrame(tick);
  }

  async function closeTimer(msg){
    if (!T.open) return;
    T.open=false; T.running=false; cancelAnimationFrame(T.raf); clearTimeout(T.endTimer);
    try{ T.lock && T.lock.release(); }catch(e){} T.lock=null;
    const card=T.card;
    if (!reduced()){
      timer.classList.add('leaving');
      await wait(150);
      const a = timer.animate([{clipPath:FULL},{clipPath:insetOf(card)}],{duration:380,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});
      await a.finished;
      timer.hidden=true; a.cancel();
      card.animate([{transform:'scale(1.06,.94)'},{transform:'scale(.98,1.02)'},{transform:POS[0]}],{duration:420,easing:'ease-out'});
    } else timer.hidden=true;
    timer.classList.remove('leaving','enter','paused','ready');
    if (msg) toast(msg);
  }
  function finish(){
    T.running=false; setPlayIcon();
    tStep.textContent='All done!';
    tPlay.querySelector('.msr').textContent='check';
    const a=activityText();
    setTimeout(()=>closeTimer(a ? `Session complete · ${a} of activity` : 'Session complete'), 1300);
  }

  tPlay.addEventListener('click', ()=>{ if (T.open && T.i===T.seq.length-1 && T.left<=0) return; togglePause(); });
  tSkip.addEventListener('click', ()=>{
    if (!T.open) return;
    if (T.i < T.seq.length-1){ loadStep(T.i+1); T.last=performance.now(); }
    else { T.left=0; render(); finish(); }
  });
  tEnd.addEventListener('click', ()=>{
    if (!T.open) return;
    if (!T.started && T.activity===0) return closeTimer();
    if (!tEnd.classList.contains('confirm')){
      // ask once before ending: the button turns into "Tap to end" for a few seconds
      tEnd.classList.add('confirm'); toast('Tap End again to finish');
      clearTimeout(T.endTimer);
      T.endTimer=setTimeout(()=>tEnd.classList.remove('confirm'), 2800);
      return;
    }
    const a=activityText();
    closeTimer(a ? `Session ended · ${a} of activity counted` : 'Session ended');
  });
  tSpeed.addEventListener('click', ()=>{
    T.speed = T.speed===1 ? 60 : 1;
    tSpeed.setAttribute('aria-pressed', T.speed!==1);
    toast(T.speed!==1 ? 'Demo speed on: 1 minute = 1 second' : 'Demo speed off');
  });

  /* ============ TOAST + PLACEHOLDERS ============ */
  const toastEl = document.getElementById('toast');
  let tt;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(tt); tt = setTimeout(()=>toastEl.classList.remove('show'), 1900);
  }
  /* ============ THEME SWITCH (settings button, prototype only) ============ */
  const THEMES = {calm:'Calm', carbon:'Carbon', mono:'Mono'};
  const ORDER = Object.keys(THEMES);
  const root = document.documentElement;
  let theme = 'calm';
  try { const t = localStorage.getItem('pomogolo-theme'); if (THEMES[t]) theme = t; } catch(e){}
  root.dataset.appTheme = theme;
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    theme = ORDER[(ORDER.indexOf(theme)+1) % ORDER.length];
    root.dataset.appTheme = theme;
    try { localStorage.setItem('pomogolo-theme', theme); } catch(e){}
    toast(`Theme: ${THEMES[theme]}`);
  });

  document.querySelectorAll('[data-soon]').forEach(b=>b.addEventListener('click',()=>toast(`${b.dataset.soon}: coming soon`)));
})();
</script>

</body>
</html>
